<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>PDF Banner Generator</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="{{ url_for('static',filename='css/style.css') }}">

</head>

<body>

<div class="container mt-5">

<div class="card shadow p-4">

PDF Banner Generator

</h2>

<form>

<div class="mb-3">

<label>Name</label>

<input
type="text"
class="form-control">

</div>

<div class="mb-3">

<label>Company</label>

<input
type="text"
class="form-control">

</div>

<div class="mb-3">

<label>Designation</label>

<input
type="text"
class="form-control">

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
class="form-control">

</div>

<div class="mb-3">

<label>Phone</label>

<input
type="text"
class="form-control">

</div>

<div class="mb-3">

<label>Upload Logo</label>

<input
type="file"
class="form-control">

</div>

<div class="mb-3">

<label>Upload Background</label>

<input
type="file"
class="form-control">

</div>

<button
class="btn btn-primary w-100">

Generate PDF

</button>

</form>

</div>

</div>

</html>
